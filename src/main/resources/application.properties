spring.application.name=api
server.port=${PORT:8080}

# Variables de entorno para producción (Aiven/Render) con localhost como respaldo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/BD_DentalCareWeb?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Control de esquema Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET:dentalcare-clave-secreta-muy-larga-y-segura-2024}
jwt.expiration.ms=${JWT_EXPIRATION_MS:3600000}

spring.jackson.serialization.write-dates-as-timestamps=false
